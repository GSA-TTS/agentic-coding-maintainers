name: Change proposal
description: Propose a tool, runbook, automation, or governance change
title: "proposal: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What maintainer need should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: State the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and sync impact
      description: Identify permissions, untrusted inputs, provenance, and downstream sync effects.
    validations:
      required: true
