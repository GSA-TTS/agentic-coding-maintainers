name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foreground:
    name: Foreground tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.15
      - name: Run foreground tests
        run: make test-foreground

  check:
    name: Remaining repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.15
      - name: Install pinned core quality tools
        shell: bash
        run: |
          set -euo pipefail
          tools/install-ci-tools.sh "$RUNNER_TEMP/quality-tools"
          echo "$RUNNER_TEMP/quality-tools/bin" >> "$GITHUB_PATH"
      - name: Run remaining tests and static checks
        run: make check-rest
      - name: Run core quality checks
        run: scripts/core-quality-check.sh
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "$expected  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner

  repository-checks:
    name: Repository checks
    needs: [foreground, check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both check jobs to succeed
        env:
          FOREGROUND_RESULT: ${{ needs.foreground.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${FOREGROUND_RESULT:-}" != success || "${CHECK_RESULT:-}" != success ]]; then
            echo 'Repository checks require both jobs to succeed.' >&2
            exit 1
          fi
